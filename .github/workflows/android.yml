name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SafeGap-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload arm64 APK to Loadly
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$LOADLY_API_KEY" ]; then
            echo "::warning::Add repository secret LOADLY_API_KEY to enable automatic Loadly uploads."
            exit 0
          fi

          APK_PATH="app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          test -f "$APK_PATH"

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST https://api.loadly.io/apiv2/app/upload \
            --form-string "_api_key=$LOADLY_API_KEY" \
            --form "file=@$APK_PATH;type=application/vnd.android.package-archive" \
            --form-string "buildInstallType=1" \
            --form-string "buildUpdateDescription=SafeGap automated build ${GITHUB_SHA::7}")

          CODE=$(jq -r '.code // -1' <<< "$RESPONSE")
          if [ "$CODE" != "0" ]; then
            MESSAGE=$(jq -r '.message // .msg // "Unknown Loadly error"' <<< "$RESPONSE")
            echo "Loadly upload failed: $MESSAGE" >&2
            exit 1
          fi

          SHORTCUT=$(jq -r '.data.buildShortcutUrl' <<< "$RESPONSE")
          BUILD_KEY=$(jq -r '.data.buildKey' <<< "$RESPONSE")
          {
            echo "### Loadly deployment"
            echo "- Install: https://loadly.io/$SHORTCUT"
            echo "- Build key: \`$BUILD_KEY\`"
          } >> "$GITHUB_STEP_SUMMARY"
